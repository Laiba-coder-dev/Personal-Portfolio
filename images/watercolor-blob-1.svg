<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Decorative watercolor wash">
  <defs>
    <!-- Watercolor edge distortion: fractal noise warps the shapes -->
    <filter id="watercolorA" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.016" numOctaves="4" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="64" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="3"/>
    </filter>

    <!-- Paper grain overlay -->
    <filter id="grainA">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <radialGradient id="pinkA" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f6b8d3" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#efa3c6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e98cb6" stop-opacity="0.1"/>
    </radialGradient>

    <radialGradient id="lilacA" cx="55%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#cbb2ef" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#b79ae4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a387d8" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <g filter="url(#watercolorA)">
    <ellipse cx="270" cy="250" rx="200" ry="175" fill="url(#pinkA)"/>
    <ellipse cx="360" cy="350" rx="160" ry="150" fill="url(#lilacA)"/>
    <ellipse cx="200" cy="380" rx="120" ry="105" fill="url(#pinkA)" opacity="0.65"/>
  </g>

  <rect width="600" height="600" filter="url(#grainA)" fill="#e98cb6"/>
</svg>
