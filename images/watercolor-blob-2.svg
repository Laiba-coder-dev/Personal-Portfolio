<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Decorative watercolor wash">
  <defs>
    <filter id="watercolorB" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.012" numOctaves="4" seed="27" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="58" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="3.5"/>
    </filter>

    <filter id="grainB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <radialGradient id="lilacB" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#cbb2ef" stop-opacity="0.88"/>
      <stop offset="62%" stop-color="#b397e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9d82cf" stop-opacity="0.08"/>
    </radialGradient>

    <radialGradient id="pinkB" cx="42%" cy="52%" r="70%">
      <stop offset="0%" stop-color="#f8c3da" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#f0a9c9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e88fb8" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <g filter="url(#watercolorB)">
    <ellipse cx="240" cy="230" rx="170" ry="155" fill="url(#lilacB)"/>
    <ellipse cx="300" cy="310" rx="130" ry="120" fill="url(#pinkB)"/>
  </g>

  <rect width="500" height="500" filter="url(#grainB)" fill="#b397e0"/>
</svg>
